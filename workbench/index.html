<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="基于 ZXL PRD Skill 的可视化产品需求共创工作台"
    />
    <title>ZXL PRD Workbench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="ZXL PRD 首页">
          <span class="brand-mark">Z</span>
          <span>
            <strong>ZXL PRD</strong>
            <small>Decision-ready workbench</small>
          </span>
        </a>

        <div class="mode-picker" aria-label="共创模式">
          <label for="mode">共创模式</label>
          <select id="mode">
            <option value="full">完整共创</option>
            <option value="fast">快速草案</option>
            <option value="review">评审模式</option>
          </select>
        </div>

        <nav id="stepNav" class="step-nav" aria-label="PRD 创建步骤"></nav>

        <div class="sidebar-footer">
          <div class="save-status">
            <span class="status-dot"></span>
            <span id="saveStatus">已自动保存到本机</span>
          </div>
          <button class="button button-ghost button-wide" id="resetButton" type="button">
            清空工作台
          </button>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <p class="eyebrow" id="phaseLabel">PHASE 1 · 建立文档契约</p>
            <h1 id="stepTitle">先对齐问题，再讨论方案</h1>
          </div>
          <div class="topbar-actions">
            <button class="button button-ghost" id="previewButton" type="button">
              预览文档
            </button>
            <button class="button button-primary" id="exportButton" type="button">
              导出 Markdown
            </button>
          </div>
        </header>

        <div class="workspace">
          <section id="stepContent" class="content-panel" aria-live="polite"></section>

          <aside class="insights-panel">
            <section class="progress-card">
              <div class="card-heading">
                <span>文档就绪度</span>
                <strong id="readinessScore">0%</strong>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-label="文档就绪度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="readinessBar" class="progress-bar"></div>
              </div>
              <p id="readinessHint">完成关键字段后即可进入下一阶段。</p>
            </section>

            <section class="insight-card">
              <div class="insight-icon">✦</div>
              <div>
                <strong>共创提示</strong>
                <p id="coachTip">
                  先描述目标用户正在经历的问题，不要急于写功能清单。
                </p>
              </div>
            </section>

            <section class="summary-card">
              <div class="card-heading">
                <span>证据完整性</span>
                <span class="badge" id="evidenceCount">0 条</span>
              </div>
              <div class="evidence-legend">
                <span><i class="legend-dot fact"></i>事实 <b id="factCount">0</b></span>
                <span><i class="legend-dot decision"></i>决策 <b id="decisionCount">0</b></span>
                <span><i class="legend-dot assumption"></i>假设 <b id="assumptionCount">0</b></span>
                <span><i class="legend-dot tbd"></i>待定 <b id="tbdCount">0</b></span>
              </div>
            </section>

            <section class="keyboard-card">
              <span><kbd>⌘</kbd><kbd>S</kbd> 自动保存</span>
              <span><kbd>⌘</kbd><kbd>↵</kbd> 下一步</span>
            </section>
          </aside>
        </div>

        <footer class="step-footer">
          <button class="button button-ghost" id="previousButton" type="button">
            ← 上一步
          </button>
          <span id="stepCounter">步骤 1 / 7</span>
          <button class="button button-primary" id="nextButton" type="button">
            下一步 →
          </button>
        </footer>
      </main>
    </div>

    <dialog id="previewDialog" class="preview-dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">LIVE PREVIEW</p>
          <h2>PRD 文档预览</h2>
        </div>
        <button class="icon-button" id="closePreviewButton" aria-label="关闭预览">×</button>
      </div>
      <pre id="markdownPreview"></pre>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
