name: Deploy AI Worker

on:
  push:
    branches:
      - master
      - cursor/install-prd-skills-ac31
      - cursor/visual-prd-workbench-5b22
    paths:
      - "worker/**"
      - ".github/workflows/deploy-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify synchronized Skill workflow
        run: python3 .cursor/skills/zxl-prd/scripts/sync_workflow.py --check

      - name: Prepare D1 task database
        run: node worker/scripts/prepare-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy secure AI gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          preCommands: wrangler d1 migrations apply zxl-prd-workbench --remote --config wrangler.generated.toml
          command: deploy --config wrangler.generated.toml
          secrets: |
            AI_API_KEY
            WORKBENCH_ACCESS_TOKEN
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          WORKBENCH_ACCESS_TOKEN: ${{ secrets.WORKBENCH_ACCESS_TOKEN }}

      - name: Verify production task API
        shell: bash
        env:
          WORKBENCH_ACCESS_TOKEN: ${{ secrets.WORKBENCH_ACCESS_TOKEN }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 \
            -H "Origin: https://mikileft.github.io" \
            -H "Authorization: Bearer ${WORKBENCH_ACCESS_TOKEN}" \
            "https://zxl-prd-ai-mikileft.xiaolong-zuox.workers.dev/api/tasks")"
          RESPONSE="$response" node -e '
            const payload = JSON.parse(process.env.RESPONSE);
            if (!Array.isArray(payload.tasks)) process.exit(1);
            console.log("Production task API is ready");
          '
